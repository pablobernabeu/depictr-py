[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "depictr"
dynamic = ["version"]
description = "A unified, colourblind-safe toolkit for publication-ready statistical visualisation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pablo Bernabeu", email = "pcbernabeu@gmail.com" }]
keywords = [
    "visualisation", "statistics", "ggplot", "plotnine", "colourblind",
    "accessibility", "publication", "EDA", "diagnostics", "survival",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    # 0.15 introduced the plot composition operators (| and /) that
    # arrange_plots and the multi-panel reports rely on.
    "plotnine>=0.15",
    # The three floors below are plotnine 0.15's own requirements rather than
    # independent choices. A lower floor could never be honoured, since the
    # resolver takes the higher bound, so it would describe a stack nobody runs.
    # A floor is a claim about what has been tested, so each matches what
    # plotnine forces and the minimum-versions CI job installs.
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scipy>=1.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Each plotting family delegates its computation to a specialist package and
# re-skins the result under the depictr theme. The specialists are optional, so
# the core installs light and each is needed only for its own functions.
# The classification extra also serves the multivariate plots whose principal
# components, k-means and silhouettes come from scikit-learn.
# plotnine 0.15 already requires statsmodels 0.14.5, so a lower floor here
# would describe a combination the core install cannot produce.
models = ["statsmodels>=0.14.5"]
classification = ["scikit-learn>=1.3"]
survival = ["lifelines>=0.27"]
# Streamlit alone: the app itself lives in the repository, not the wheel, so
# this extra is for an editable install from a clone (`pip install -e ".[app]"`).
# The app sizes its figure and table with width="stretch", which replaced the
# deprecated use_container_width and first reached st.image in Streamlit 1.49.
app = ["streamlit>=1.49"]
all = [
    "statsmodels>=0.14.5", "scikit-learn>=1.3", "lifelines>=0.27",
    "streamlit>=1.49",
]
test = [
    "pytest>=7.0",
    # CI reads the overall figure with "coverage report --format=total", which
    # needs coverage 7; pytest-cov 6 is the first release to require it.
    "pytest-cov>=6",
    "ruff>=0.4",
    # An independent implementation of the Machado colour-vision transforms,
    # kept only so the package's own can be checked against it. The tests that
    # use it skip when it is absent.
    "colorspacious>=1.1",
]
docs = [
    "mkdocs-material>=9.5", "mkdocstrings[python]>=0.24", "markdown-exec>=1.8",
    # Keeps the retired per-group reference paths resolving after the reference
    # was gathered into the single api.md page.
    "mkdocs-redirects>=1.2",
]

[project.urls]
Homepage = "https://github.com/pablobernabeu/depictr-py"
Documentation = "https://pablobernabeu.github.io/depictr-py/"
Issues = "https://github.com/pablobernabeu/depictr-py/issues"
"R sibling" = "https://pablobernabeu.github.io/depictr/"

[tool.hatch.version]
# Single source of truth: __version__ in the package.
path = "src/depictr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/depictr"]

[tool.hatch.build.targets.sdist]
# Keep the generated docs site out of the source distribution; it is gitignored
# but can linger on disk from a local build.
exclude = [
    "site",
    "/images/**",  # README plots, served from GitHub raw, not needed in the package
]

# overrides/partials/header.html is a fork of mkdocs-material's own partial.
# The docs extra sets no ceiling, so a deploy installs the latest release, and
# `mkdocs build --strict` cannot tell that the template has fallen behind the
# upstream file. The docs workflow hashes the installed partial and compares it
# with the hash recorded here, of the partial the fork was taken from. A
# release that leaves the template alone passes, and one that rewrites it
# fails the deploy until the fork is redone. The record lives here because
# MkDocs copies any unrecognised file in the theme directory into the
# published site. scopusflow-py keeps the same record for its fork.
[tool.depictr.mkdocs-material-fork]
version = "9.7.6"
partials_header_sha256 = "8cf3fb15bcf969ff596649616fd99366b3c31c08d57a86d05308efc16d8fa75f"

[tool.pytest.ini_options]
# The Examples section of every public docstring is a real doctest and is
# collected with the suite, so a documented call cannot drift out of step with
# the API without a test going red.
addopts = "--doctest-modules"
testpaths = ["tests", "src/depictr"]
markers = [
    "slow: takes minutes; runs with the full suite, deselect with -m 'not slow'",
]
# A DeprecationWarning that depictr's own code triggers fails the suite, so a
# call that a dependency is about to remove is caught while it still works. The
# module field matches the start of a module's name, so it covers every depictr
# module and leaves alone the warnings that plotnine triggers in pandas.
# pandas' Pandas4Warning is a DeprecationWarning. It is not named, since pandas
# 2 does not define it.
filterwarnings = ["error::DeprecationWarning:depictr"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

# State the rule set rather than inheriting whatever the installed ruff happens
# to default to. Ruff 0.16 widened its defaults, which turned a sibling
# package's green CI red without a line of it changing. The set below matches
# the scopusflow and theoryforge twins, so the family lints to one standard.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

# .github/check_doi_display.py is the family's DOI display check. It must stay
# byte-for-byte identical in all seven repositories, so its long lines are left
# as they are.
[tool.ruff.lint.per-file-ignores]
".github/check_doi_display.py" = ["E501"]
