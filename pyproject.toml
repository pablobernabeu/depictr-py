[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "depictr"
dynamic = ["version"]
description = "A unified, colourblind-safe toolkit for publication-ready statistical visualisation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Pablo Bernabeu", email = "pcbernabeu@gmail.com" }]
keywords = [
    "visualisation", "statistics", "ggplot", "plotnine", "colourblind",
    "accessibility", "publication", "EDA", "diagnostics", "survival",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    # 0.15 introduced the plot composition operators (| and /) that
    # arrange_plots and the multi-panel reports rely on.
    "plotnine>=0.15",
    # The three floors below are plotnine 0.15's own requirements rather than
    # independent choices. They were once lower (pandas 2.0, matplotlib 3.6,
    # scipy 1.7), which no install could ever have honoured: the resolver takes
    # the higher bound, so the declaration described a stack nobody ran. A
    # floor is a claim about what has been tested, so it now matches what
    # plotnine forces and the minimum-versions CI job installs.
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scipy>=1.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Each plotting family delegates its computation to a specialist package and
# re-skins the result under the depictr theme. The specialists are optional, so
# the core installs light and each is needed only for its own functions.
# plotnine 0.15 already requires statsmodels 0.14.5, so a lower floor here
# would describe a combination the core install cannot produce.
models = ["statsmodels>=0.14.5"]
classification = ["scikit-learn>=1.3"]
survival = ["lifelines>=0.27"]
# Streamlit alone: the app itself lives in the repository, not the wheel, so
# this extra is for an editable install from a clone (`pip install -e ".[app]"`).
app = ["streamlit>=1.30"]
all = [
    "statsmodels>=0.14.5", "scikit-learn>=1.3", "lifelines>=0.27",
    "streamlit>=1.30",
]
test = [
    "pytest>=7.0",
    # CI reads the overall figure with "coverage report --format=total", which
    # needs coverage 7; pytest-cov 6 is the first release to require it.
    "pytest-cov>=6",
    "ruff>=0.4",
    # An independent implementation of the Machado colour-vision transforms,
    # kept only so the package's own can be checked against it. The tests that
    # use it skip when it is absent.
    "colorspacious>=1.1",
]
docs = [
    "mkdocs-material>=9.5", "mkdocstrings[python]>=0.24", "markdown-exec>=1.8",
    # Keeps the retired per-group reference paths resolving after the reference
    # was gathered into the single api.md page.
    "mkdocs-redirects>=1.2",
]

[project.urls]
Homepage = "https://github.com/pablobernabeu/depictr-py"
Documentation = "https://pablobernabeu.github.io/depictr-py/"
Issues = "https://github.com/pablobernabeu/depictr-py/issues"
"R sibling" = "https://pablobernabeu.github.io/depictr/"

[tool.hatch.version]
# Single source of truth: __version__ in the package.
path = "src/depictr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/depictr"]

[tool.hatch.build.targets.sdist]
# Keep the generated docs site out of the source distribution; it is gitignored
# but can linger on disk from a local build.
exclude = [
    "site",
    "/images/**",  # README plots, served from GitHub raw, not needed in the package
]

[tool.pytest.ini_options]
# The Examples section of every public docstring is a real doctest and is
# collected with the suite, so a documented call cannot drift out of step with
# the API without a test going red.
addopts = "--doctest-modules"
testpaths = ["tests", "src/depictr"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

# State the rule set rather than inheriting whatever the installed ruff happens
# to default to. Ruff 0.16 widened its defaults, which turned a sibling
# package's green CI red without a line of it changing. The set below matches
# the scopusflow and theoryforge twins, so the family lints to one standard.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
