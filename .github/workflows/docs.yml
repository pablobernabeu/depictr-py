name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-progress deployment at a time; do not cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package, its back-ends and the docs tools
        run: python -m pip install -e ".[all,docs]"

      # overrides/partials/header.html is a fork of mkdocs-material's own
      # partial, and the docs extra sets no ceiling, so this job installs the
      # latest release. --strict catches a broken link but not a template that
      # has fallen behind upstream. The installed partial is hashed and compared
      # with the hash of the one the fork was taken from, which
      # [tool.depictr.mkdocs-material-fork] in pyproject.toml records, so the
      # step fails only when upstream rewrites the file. scopusflow-py runs the
      # same check.
      - name: Check the header override against the mkdocs-material it forked
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import sys
          import tomllib

          import material

          with open("pyproject.toml", "rb") as fh:
              record = tomllib.load(fh)["tool"]["depictr"]["mkdocs-material-fork"]

          upstream = pathlib.Path(material.__file__).parent / "templates/partials/header.html"
          actual = hashlib.sha256(upstream.read_bytes()).hexdigest()
          if actual != record["partials_header_sha256"]:
              sys.exit(
                  "partials/header.html has changed since mkdocs-material "
                  f"{record['version']}.\n"
                  "Re-diff overrides/partials/header.html against the new upstream "
                  "template, re-apply the App link and moved-palette blocks, then "
                  "update [tool.depictr.mkdocs-material-fork] in pyproject.toml.\n"
                  f"  expected {record['partials_header_sha256']}\n  installed {actual}"
              )
          print(f"header.html unchanged since mkdocs-material {record['version']}")
          PY

      - name: Build the mkdocs site
        run: python -m mkdocs build --strict

      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
