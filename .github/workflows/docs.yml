name: docs

# A pull request builds the site without publishing it, so that a change that
# breaks the build, the gallery code or a docstring shows before the merge.
# Only a push to main, or 'Run workflow' on main, publishes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The build reads the repository. Only the deploy job writes, to GitHub Pages.
permissions:
  contents: read

# One deployment at a time, and a running one is never cancelled. A pull
# request's builds form their own group, in which a new push cancels the
# build it makes out of date.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package, its back-ends and the docs tools
        run: python -m pip install -e ".[all,docs]"

      # overrides/partials/header.html is a fork of mkdocs-material's own
      # partial, and the docs extra sets no ceiling, so this job installs the
      # latest release. --strict catches a broken link but not a template that
      # has fallen behind upstream. The installed partial is hashed and compared
      # with the hash of the one the fork was taken from, which
      # [tool.depictr.mkdocs-material-fork] in pyproject.toml records, so the
      # step fails only when upstream rewrites the file. scopusflow-py runs the
      # same check.
      - name: Check the header override against the mkdocs-material it forked
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import sys
          import tomllib

          import material

          with open("pyproject.toml", "rb") as fh:
              record = tomllib.load(fh)["tool"]["depictr"]["mkdocs-material-fork"]

          upstream = pathlib.Path(material.__file__).parent / "templates/partials/header.html"
          actual = hashlib.sha256(upstream.read_bytes()).hexdigest()
          if actual != record["partials_header_sha256"]:
              sys.exit(
                  "partials/header.html has changed since mkdocs-material "
                  f"{record['version']}.\n"
                  "Re-diff overrides/partials/header.html against the new upstream "
                  "template, re-apply the version chip, the App link and the moved-palette blocks, then "
                  "update [tool.depictr.mkdocs-material-fork] in pyproject.toml.\n"
                  f"  expected {record['partials_header_sha256']}\n  installed {actual}"
              )
          print(f"header.html unchanged since mkdocs-material {record['version']}")
          PY

      - name: Build the mkdocs site
        run: python -m mkdocs build --strict

      - name: Upload the site as a Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
