# Build and publish a release to PyPI through trusted publishing (OIDC), so no
# API token is ever stored in the repository.
#
# One-time setup on PyPI: in the project's Publishing settings, add this
# repository as a trusted publisher with workflow file "publish.yml" and
# environment "pypi" (the depictr project already exists on PyPI, so this is a
# regular trusted publisher, not a pending one). The workflow runs when a
# GitHub release is published; the manual trigger exists so a release cut
# before this workflow was added can still be shipped from the same commit.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

# The build job only needs to read the repository. The publish job declares its
# own permissions block, which replaces this default entirely and grants just
# the id-token needed for trusted publishing.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # skip-existing below lets a run upload nothing and still pass, so a tag
      # on a commit that still carries the previous version would build that
      # version and publish nothing. On any tag, from a release or from a
      # dispatch on the tag, the version the package declares has to be the
      # one the tag names. The package version is bumped when a release is
      # prepared, but CITATION.cff and the changelog heading take the new
      # version only in the later commit that dates it. The sdist carries
      # CITATION.cff, so a tag on a commit before that one stops here as well,
      # before PyPI receives a release that cites the one before.
      - name: Check that the tag names the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/depictr/__init__.py)
          cited=$(sed -n 's/^version: "\(.*\)"$/\1/p' CITATION.cff)
          echo "Tag ${GITHUB_REF_NAME}, package version ${version}, CITATION.cff version ${cited}"
          test "v${version}" = "${GITHUB_REF_NAME}"
          test "v${cited}" = "${GITHUB_REF_NAME}"
          grep -E "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check the distribution
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/depictr/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          skip-existing: true
