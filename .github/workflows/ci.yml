name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dependencies move when this repository does not, and depictr sits on a deep
  # plotting stack. A weekly run turns an upstream break into a dated red badge
  # rather than a surprise on the next push.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# The workflow only checks out and tests the code, so the default token needs
# nothing beyond read access to the repository contents.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package with its optional back-ends and test tools
        run: python -m pip install -e ".[all,test]"

      # The whole repository, not src and tests alone, so app/ and docs/ are
      # linted too and a new top-level script is covered the day it is added
      # rather than whenever someone remembers to extend a list. This matches the
      # scopusflow twin, which lints everything.
      - name: Lint
        run: ruff check .

      - name: Run the test suite with coverage
        env:
          MPLBACKEND: Agg   # headless: no display on the runner
        run: |
          python -m pytest -q --cov=depictr --cov-report=term
          # Surface the overall figure in the job summary so it can be read at
          # a glance rather than dug out of the log. Coverage is reported, not
          # gated: there is deliberately no fail-under threshold.
          echo "Coverage: $(python -m coverage report --format=total)% of lines (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"

  # The matrix above installs the package editable from the checkout, where a
  # missing packaged file is masked by the source tree sitting next to it. This
  # job proves the built wheel stands on its own: install it into a bare
  # environment, leave the repository, and draw a plot from there.
  wheel:
    name: Installed wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel outside the checkout and draw a plot
        env:
          MPLBACKEND: Agg   # headless: no display on the runner
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/wheel-venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import os

          import depictr as dp

          print("depictr", dp.__version__)
          assert dp.__version__
          # Rendering a real figure is what the import alone cannot prove: it
          # pulls in a bundled dataset, the theme, the palette and plotnine's
          # renderer, all from an installed wheel with no source tree in sight.
          plot = dp.explore_distribution(
              dp.lexical_decision(), "RT", group="condition", kind="both"
          )
          plot.save("smoke.png", width=4, height=3, dpi=72, verbose=False)
          assert os.path.getsize("smoke.png") > 0
          # The datasets are CSV files inside the package, so each one is read
          # here to prove the wheel carries them all, with levels.json.
          shapes = {"crop_yield": (200, 6), "wellbeing_survey": (300, 9),
                    "lexical_decision": (960, 7), "clinical_trial": (300, 7),
                    "monthly_sales": (144, 3)}
          for name, shape in shapes.items():
              assert getattr(dp, name)().shape == shape, name
          assert dp.wellbeing_survey()["education"].cat.ordered
          # The accessibility check is the package's central claim, so the wheel
          # has to be able to run it, not merely to ship the module.
          assert dp.palette_safety()["safe"] is True
          PY

  # The floors in pyproject are a promise to anyone resolving against an older
  # stack. This job installs the oldest declared minor series of each core
  # dependency so the promise stays honest. A failure here means the floors
  # need raising to what actually works, not that the job is too strict.
  minimum-versions:
    name: Declared minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install the declared floors, then the package without resolution
        run: |
          python -m pip install --upgrade pip
          pip install "plotnine==0.15.*" "pandas==2.2.*" "numpy==1.24.*" \
                      "matplotlib==3.8.*" "scipy==1.8.*" pytest
          pip install -e . --no-deps
      # tests/ only, not the default testpaths: those also collect the doctests
      # in src/, whose Examples call the classification and survival back-ends.
      # Neither is installed here (statsmodels is, as a dependency of plotnine
      # itself), and their floors are not what this job is checking, so
      # collecting them would fail for a reason unrelated to the core floors.
      # The suite itself skips a back-end it cannot import.
      - name: Run the test suite against the core floors
        env:
          MPLBACKEND: Agg   # headless: no display on the runner
        run: python -m pytest tests -q

  # lifelines declares pandas<3, so the matrix above, which installs the all
  # extra, never resolves pandas 3. This job leaves out the survival extra, so
  # pip installs the latest pandas. The survival tests skip without lifelines,
  # and the doctests in src/ are left out, as in the floors job, since the
  # example of survival_plot() needs lifelines.
  latest-pandas:
    name: Latest pandas, without lifelines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install the package without the survival back-end
        run: |
          python -m pip install -e ".[models,classification,test]"
          python -c "import pandas; assert int(pandas.__version__.split('.')[0]) >= 3, pandas.__version__"
      - name: Run the test suite against the latest pandas
        env:
          MPLBACKEND: Agg   # headless: no display on the runner
        run: python -m pytest tests -q
