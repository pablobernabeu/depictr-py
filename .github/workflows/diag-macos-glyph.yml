name: diag-macos-glyph

# Temporary diagnostic on a short-lived fix/ branch. Never merged.
on:
  push:
    branches: [fix/macos-glyph]

permissions:
  contents: read

jobs:
  freetype:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15]
        mpl: ["3.10.9", "3.11.0", "3.11.2"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install "matplotlib==${{ matrix.mpl }}"
      - run: python -c "import matplotlib, platform; print(matplotlib.__version__, platform.mac_ver()[0])"
      - run: python diag/report_snippet.py || echo "exit status $?"
      - run: |
          python diag/report_workaround.py force_autohint || echo "exit status $?"
          python diag/report_workaround.py no_hinting || echo "exit status $?"
      - run: python diag/report_ft2font.py || echo "exit status $?"
      - run: |
          brew list --versions freetype || brew install freetype
          python diag/report_ctypes.py
