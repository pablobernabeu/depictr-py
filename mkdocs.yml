site_name: depictr (Python)
site_description: A unified, colourblind-safe toolkit for publication-ready statistical visualisation, built on plotnine.
site_url: https://pablobernabeu.github.io/depictr-py/
repo_url: https://github.com/pablobernabeu/depictr-py
# repo_name is left unset so the header shows a compact "GitHub" chip.
# The licence link is absolute: the copyright line renders on every page, and a
# relative link would resolve against nested pages and break.
copyright: >
  <span class="mrd-footer-badges">
  <a href="https://github.com/pablobernabeu/depictr-py/actions/workflows/ci.yml"><img src="https://github.com/pablobernabeu/depictr-py/actions/workflows/ci.yml/badge.svg" alt="CI"></a>
  <a href="https://lifecycle.r-lib.org/articles/stages.html#experimental"><img src="https://img.shields.io/badge/lifecycle-experimental-orange.svg" alt="Lifecycle: experimental"></a>
  <a href="https://opensource.org/license/MIT"><img src="https://img.shields.io/badge/license-MIT-blue.svg" alt="License: MIT"></a>
  </span>
  Developed by <a href="https://pablobernabeu.github.io">Pablo Bernabeu</a> ·
  Released under the
  <a href="https://pablobernabeu.github.io/depictr-py/licence/">MIT licence</a>

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  # Header and footer sit at depictr's deep navy-blue; the accent is coral.
  # primary: black is the closest preset, retuned to the exact colour in
  # stylesheets/brand.css.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/brand.css

plugins:
  - search
  # Runs the gallery example blocks at build time and embeds the rendered
  # plotnine figures inline, like a knitted vignette.
  - markdown-exec
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            separate_signature: true
            # api.md groups the objects under seven h2 sections, mirroring the R
            # package's reference index. At mkdocstrings' default level the object
            # headings would also be h2, flattening the table of contents into one
            # list in which no object shows which group it belongs to.
            heading_level: 3
  # The reference used to be seven pages under docs/reference/, one per function
  # group, and those paths are bookmarked, linked from outside the site and
  # indexed by search engines. The plugin writes a stub at each old path, and the
  # stub carries any anchor across, so a deep link to a single function still
  # lands on that function. The anchors themselves are unchanged, because
  # mkdocstrings derives them from the object's path rather than from the page.
  - redirects:
      redirect_maps:
        reference/theme-and-accessibility.md: api.md
        reference/exploratory.md: api.md
        reference/estimation-and-models.md: api.md
        reference/diagnostics.md: api.md
        reference/classification.md: api.md
        reference/multivariate-survival-timeseries.md: api.md
        reference/composition-and-data.md: api.md

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      # Tag each block with its language, so brand.css can tell output pasted
      # into a `text` fence from a source block and style it as output.
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true

nav:
  - Home: index.md
  - Get started: getting-started.md
  - API reference: api.md
  # Labelled Articles to match the R twin's navbar and the rest of the family,
  # while the pages keep their gallery/ paths so existing links still resolve.
  # The app page is listed here rather than at top level, because the header
  # override already links it as a pill and the family carries one app entry.
  - Articles:
      - Exploring data: gallery/exploring-data.md
      - Model estimates and diagnostics: gallery/model-estimates.md
      - Classification and survival: gallery/classification-and-survival.md
      - Multivariate and time series: gallery/multivariate-and-time-series.md
      - Accessibility: gallery/accessibility.md
      - The web app: app.md
  - Changelog: changelog.md
  - About: about.md

# The released version shown beside the title in the header (updated on release).
extra:
  version: "0.3.0"
